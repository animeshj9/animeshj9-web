name: Lab checks and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and regression tests
        run: npm test
      - name: Validate static assets and JavaScript
        run: npm run check
      - name: Package public website for GitHub Pages
        run: npm run build
      - name: Validate Cloudflare migration bundle
        run: npm run build:worker && npx wrangler deploy --dry-run --config wrangler.subdomains.jsonc
      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (enable GitHub Actions in Settings > Pages first)
        uses: actions/configure-pages@v5
      - name: Deploy tested artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
